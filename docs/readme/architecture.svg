<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-label="Architecture: the storefront and admin Next.js apps call the Express REST API, which uses MongoDB, Redis, Cloudflare R2, Razorpay and Stripe, and SMTP. The storefront also calls the AI stylist service, which reads MongoDB and runs local models through Ollama">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#141a38"/></linearGradient>
    <linearGradient id="api" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a1f66"/><stop offset="1" stop-color="#123047"/></linearGradient>
  </defs>
  <style>
    .t  { font: 700 19px "Segoe UI", Helvetica, Arial, sans-serif; fill: #f1f5f9; }
    .s  { font: 500 13.5px "Segoe UI", Helvetica, Arial, sans-serif; fill: #94a3b8; }
    .tag { font: 600 12px "Segoe UI", Helvetica, Arial, sans-serif; fill: #22d3ee; letter-spacing: 1px; }
    .node { fill: #10173a; stroke: #2e3870; stroke-width: 1.5; }
    .wire { fill: none; stroke: #3b4a8c; stroke-width: 2; stroke-dasharray: 6 10; animation: flow 1.2s linear infinite; }
    .wire.up { animation-direction: reverse; }
    @keyframes flow { to { stroke-dashoffset: -16; } }
    .pulse { fill: none; stroke: #7c5cff; stroke-width: 2; animation: pulse 2.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(1.08, 1.35); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .pulse { display: none; } }
  </style>

  <rect width="1200" height="580" rx="24" fill="url(#bg)"/>

  <!-- wires (drawn first so boxes sit on top) -->
  <path id="w1" class="wire" d="M330 132 C330 190 500 180 520 238"/>
  <path id="w2" class="wire" d="M870 132 C870 190 700 180 680 238"/>
  <path id="d1" class="wire" d="M560 344 C520 390 170 380 170 432"/>
  <path id="d2" class="wire" d="M580 344 C560 390 385 385 385 432"/>
  <path id="d3" class="wire" d="M600 344 L600 432"/>
  <path id="d4" class="wire" d="M620 344 C640 390 815 385 815 432"/>
  <path id="d5" class="wire" d="M640 344 C680 390 1030 380 1030 432"/>
  <path id="w3" class="wire" d="M230 132 C230 180 190 190 190 238"/>
  <path id="d6" class="wire" d="M150 344 L150 432"/>

  <!-- packets travelling along the wires -->
  <circle r="5" fill="#34d399"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#w1"/></animateMotion></circle>
  <circle r="5" fill="#a78bfa"><animateMotion dur="2.4s" begin="-1.2s" repeatCount="indefinite"><mpath href="#w2"/></animateMotion></circle>
  <circle r="4" fill="#22d3ee"><animateMotion dur="2.8s" begin="-.3s" repeatCount="indefinite"><mpath href="#d1"/></animateMotion></circle>
  <circle r="4" fill="#f87171"><animateMotion dur="2.8s" begin="-.9s" repeatCount="indefinite"><mpath href="#d2"/></animateMotion></circle>
  <circle r="4" fill="#fbbf24"><animateMotion dur="2.2s" begin="-1.5s" repeatCount="indefinite"><mpath href="#d3"/></animateMotion></circle>
  <circle r="4" fill="#818cf8"><animateMotion dur="2.8s" begin="-2.1s" repeatCount="indefinite"><mpath href="#d4"/></animateMotion></circle>
  <circle r="4" fill="#34d399"><animateMotion dur="2.8s" begin="-.6s" repeatCount="indefinite"><mpath href="#d5"/></animateMotion></circle>
  <circle r="5" fill="#f472b6"><animateMotion dur="2s" begin="-.8s" repeatCount="indefinite"><mpath href="#w3"/></animateMotion></circle>
  <circle r="4" fill="#f472b6"><animateMotion dur="1.8s" begin="-.4s" repeatCount="indefinite"><mpath href="#d6"/></animateMotion></circle>

  <text class="tag" x="345" y="196">HTTPONLY COOKIES</text>
  <text class="tag" x="742" y="196">HTTPONLY COOKIES</text>

  <!-- frontends -->
  <rect class="node" x="180" y="36" width="300" height="96" rx="16"/>
  <text class="t" x="204" y="70">🛍️ Storefront</text>
  <text class="s" x="204" y="94">Next.js 16 · React 19 · Tailwind 4 · :3000</text>
  <text class="s" x="204" y="114">browse · cart · checkout · account</text>

  <rect class="node" x="720" y="36" width="300" height="96" rx="16"/>
  <text class="t" x="744" y="70">🧭 Admin console</text>
  <text class="s" x="744" y="94">Next.js 16 · React 19 · :3001</text>
  <text class="s" x="744" y="114">catalog · orders · customers · sales</text>

  <!-- API -->
  <rect class="pulse" x="390" y="238" width="420" height="106" rx="18"/>
  <rect x="390" y="238" width="420" height="106" rx="18" fill="url(#api)" stroke="#7c5cff" stroke-width="2"/>
  <text class="t" x="414" y="274">⚙️ REST API · Express 5 · /api/v1</text>
  <text class="s" x="414" y="299">Zod validation · Helmet · CSRF origin guard · rate limits</text>
  <text class="s" x="414" y="321">auth · catalog · cart · orders · payments · uploads · audit</text>

  <!-- AI stylist (same access cookie as the API; reads the catalog, models run locally) -->
  <rect class="node" x="30" y="238" width="330" height="106" rx="18" stroke="#f472b6"/>
  <text class="t" x="52" y="274">🪄 AI Stylist · :4100</text>
  <text class="s" x="52" y="299">Ollama (qwen3 · nomic-embed) · Open-Meteo</text>
  <text class="s" x="52" y="321">intent · hybrid search · chat agent</text>

  <!-- services -->
  <rect class="node" x="75" y="432" width="190" height="104" rx="16"/>
  <text class="t" x="97" y="468">🍃 MongoDB</text>
  <text class="s" x="97" y="492">Mongoose 9</text>
  <text class="s" x="97" y="512">catalog · orders · audit</text>

  <rect class="node" x="290" y="432" width="190" height="104" rx="16"/>
  <text class="t" x="312" y="468">⚡ Redis</text>
  <text class="s" x="312" y="492">sessions · OTPs</text>
  <text class="s" x="312" y="512">rate limits · locks</text>

  <rect class="node" x="505" y="432" width="190" height="104" rx="16"/>
  <text class="t" x="527" y="468">🖼️ Cloudflare R2</text>
  <text class="s" x="527" y="492">product images</text>
  <text class="s" x="527" y="512">presigned uploads</text>

  <rect class="node" x="720" y="432" width="190" height="104" rx="16"/>
  <text class="t" x="742" y="468">💳 Payments</text>
  <text class="s" x="742" y="492">Razorpay · Stripe · COD</text>
  <text class="s" x="742" y="512">signed webhooks</text>

  <rect class="node" x="935" y="432" width="190" height="104" rx="16"/>
  <text class="t" x="957" y="468">✉️ SMTP</text>
  <text class="s" x="957" y="492">verify · reset · OTP</text>
  <text class="s" x="957" y="512">order emails</text>
</svg>
