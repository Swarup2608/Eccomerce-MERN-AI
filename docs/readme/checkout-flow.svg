<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-label="Checkout pipeline: cart, re-price from the database, reserve stock atomically, create an idempotent order, pay, verify the payment and confirm">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#141a38"/></linearGradient>
    <linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#34d399"/></linearGradient>
  </defs>
  <style>
    .h { font: 700 16px "Segoe UI", Helvetica, Arial, sans-serif; fill: #f1f5f9; }
    .d { font: 500 13px "Segoe UI", Helvetica, Arial, sans-serif; fill: #94a3b8; }
    .n { font: 800 18px "Segoe UI", Helvetica, Arial, sans-serif; fill: #0b1020; }
    .title { font: 600 14px "Segoe UI", Helvetica, Arial, sans-serif; fill: #94a3b8; letter-spacing: 3px; }
    .track { stroke: #263066; stroke-width: 6; stroke-linecap: round; }
    .prog { stroke: url(#bar); stroke-width: 6; stroke-linecap: round; stroke-dasharray: 1000; stroke-dashoffset: 1000;
            animation: prog 8s linear infinite; }
    @keyframes prog { 0%, 5% { stroke-dashoffset: 1000; } 61.25%, 88% { stroke-dashoffset: 0; } 96%, 100% { stroke-dashoffset: 1000; } }
    .dot { fill: #263066; stroke: #3b4a8c; stroke-width: 2; }
    .l0 { animation: l0 8s infinite; } .l1 { animation: l1 8s infinite; } .l2 { animation: l2 8s infinite; }
    .l3 { animation: l3 8s infinite; } .l4 { animation: l4 8s infinite; } .l5 { animation: l5 8s infinite; }
    @keyframes l0 { 0%, 4.9% { fill: #263066; } 7%, 88% { fill: #a78bfa; } 96%, 100% { fill: #263066; } }
    @keyframes l1 { 0%, 16.1% { fill: #263066; } 18.3%, 88% { fill: #8b9cf8; } 96%, 100% { fill: #263066; } }
    @keyframes l2 { 0%, 27.4% { fill: #263066; } 29.5%, 88% { fill: #60b4f6; } 96%, 100% { fill: #263066; } }
    @keyframes l3 { 0%, 38.6% { fill: #263066; } 40.8%, 88% { fill: #22d3ee; } 96%, 100% { fill: #263066; } }
    @keyframes l4 { 0%, 49.9% { fill: #263066; } 52%, 88% { fill: #2bd4c0; } 96%, 100% { fill: #263066; } }
    @keyframes l5 { 0%, 61.1% { fill: #263066; } 63.3%, 88% { fill: #34d399; } 96%, 100% { fill: #263066; } }
    .done { opacity: 0; animation: done 8s infinite; }
    @keyframes done { 0%, 64% { opacity: 0; } 68%, 88% { opacity: 1; } 94%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .prog { stroke-dashoffset: 0; }
      .l0, .l1, .l2, .l3, .l4, .l5 { fill: #22d3ee; }
      .done { opacity: 1; }
    }
  </style>

  <rect width="1200" height="270" rx="24" fill="url(#bg)"/>
  <text class="title" x="100" y="48">POST /api/v1/orders · WHAT HAPPENS AT CHECKOUT</text>

  <line class="track" x1="100" y1="118" x2="1100" y2="118"/>
  <line class="prog" x1="100" y1="118" x2="1100" y2="118"/>

  <g text-anchor="middle">
    <circle class="dot l0" cx="100" cy="118" r="22"/><text class="n" x="100" y="124">1</text>
    <text class="h" x="100" y="172">Cart</text>
    <text class="d" x="100" y="194">guest → server cart</text>

    <circle class="dot l1" cx="300" cy="118" r="22"/><text class="n" x="300" y="124">2</text>
    <text class="h" x="300" y="172">Re-price from DB</text>
    <text class="d" x="300" y="194">never trust the client</text>
    <text class="d" x="300" y="213">integer paise</text>

    <circle class="dot l2" cx="500" cy="118" r="22"/><text class="n" x="500" y="124">3</text>
    <text class="h" x="500" y="172">Reserve stock</text>
    <text class="d" x="500" y="194">atomic conditional $inc</text>
    <text class="d" x="500" y="213">all-or-nothing</text>

    <circle class="dot l3" cx="700" cy="118" r="22"/><text class="n" x="700" y="124">4</text>
    <text class="h" x="700" y="172">Create order</text>
    <text class="d" x="700" y="194">idempotency key +</text>
    <text class="d" x="700" y="213">unique index</text>

    <circle class="dot l4" cx="900" cy="118" r="22"/><text class="n" x="900" y="124">5</text>
    <text class="h" x="900" y="172">Pay</text>
    <text class="d" x="900" y="194">Razorpay · Stripe · COD</text>

    <circle class="dot l5" cx="1100" cy="118" r="22"/><text class="n" x="1100" y="124">6</text>
    <text class="h" x="1100" y="172">Verify &amp; confirm</text>
    <text class="d" x="1100" y="194">HMAC / signed webhook</text>
    <text class="d" x="1100" y="213">deduped events</text>
  </g>

  <g class="done">
    <rect x="958" y="28" width="196" height="34" rx="17" fill="#34d399" fill-opacity=".15" stroke="#34d399"/>
    <text x="1056" y="50" text-anchor="middle" style="font: 700 14px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #34d399;">✓ Order confirmed</text>
  </g>
</svg>
