<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="_ds/modernist-57bd1623-bd8d-4d6e-b6aa-4b82e259ca98/_ds_bundle.js"></script>
</helmet>
<article onMouseEnter="{{ onEnter }}" onMouseLeave="{{ onLeave }}" style="display:flex;flex-direction:column;gap:10px;min-width:0;height:100%;">
  <div onClick="{{ p.open }}" style="position:relative;aspect-ratio:4/5;cursor:pointer;overflow:hidden;border-radius:var(--box-r,0px);background:var(--color-surface);transform:translateY({{ lift }});box-shadow:{{ shadow }};transition:transform .5s cubic-bezier(.2,.7,.2,1),box-shadow .5s;">
    <span role="img" aria-label="{{ p.name }}" style="position:absolute;inset:0;display:block;background:var(--color-surface) url({{ p.img }}) center/cover no-repeat;transform:scale({{ zoom }});transition:transform 1.2s cubic-bezier(.2,.7,.2,1);"></span>
    <span aria-hidden="true" style="position:absolute;inset:0;display:block;background:url({{ p.img2 }}) center/cover no-repeat;opacity:{{ altOpacity }};transform:scale({{ zoom }});transition:opacity .55s ease,transform 1.2s cubic-bezier(.2,.7,.2,1);"></span>
    <div style="position:absolute;top:12px;left:12px;display:flex;gap:6px;flex-wrap:wrap;">
      <sc-if value="{{ p.hasDiscount }}" hint-placeholder-val="{{ false }}"><span class="tag tag-accent">−{{ p.discount }}%</span></sc-if>
      <sc-if value="{{ p.hasTag }}" hint-placeholder-val="{{ false }}"><span class="tag tag-neutral">{{ p.tag }}</span></sc-if>
    </div>
    <button aria-label="Save to wishlist" onClick="{{ p.wish }}" style="position:absolute;top:10px;right:10px;width:40px;height:40px;display:grid;place-items:center;border:0;cursor:pointer;border-radius:999px;background:var(--color-bg);color:{{ heartColor }};transition:transform .2s;" style-hover="transform:scale(1.08);">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="{{ heartFill }}" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg>
    </button>
    <div style="position:absolute;left:10px;right:10px;bottom:10px;display:flex;align-items:center;gap:8px;">
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;padding:9px 16px;background:var(--color-bg);border-radius:var(--pill,0px);">
        <span style="font-size:14px;font-weight:600;color:var(--color-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ p.name }}</span>
        <span style="display:flex;gap:8px;align-items:baseline;font-size:13px;font-variant-numeric:tabular-nums;color:var(--color-text);"><b style="font-weight:600;">{{ p.price }}</b><sc-if value="{{ p.hasDiscount }}" hint-placeholder-val="{{ false }}"><span style="text-decoration:line-through;color:color-mix(in srgb,var(--color-text) 50%,transparent);">{{ p.was }}</span></sc-if></span>
      </div>
      <button aria-label="Add to bag" onClick="{{ quickAdd }}" style="width:46px;height:46px;flex:none;display:grid;place-items:center;border:0;cursor:pointer;border-radius:999px;background:var(--color-text);color:var(--color-bg);transform:rotate({{ plusRot }});transition:transform .4s cubic-bezier(.2,.7,.2,1),background-color .2s;" style-hover="background:var(--color-accent-600);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
    </div>
  </div>
  <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 4px;font-size:12px;color:color-mix(in srgb,var(--color-text) 62%,transparent);">
    <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ p.vendorName }} · ★ {{ p.rating }} ({{ p.reviews }})</span>
    <span style="display:flex;gap:4px;flex:none;">
      <sc-for list="{{ p.colors }}" as="c" hint-placeholder-count="2"><span title="{{ c.name }}" style="width:11px;height:11px;border-radius:50%;background:{{ c.sw }};border:1px solid var(--color-divider);"></span></sc-for>
    </span>
  </div>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:420},&quot;p&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}">
class Component extends DCLogic {
  state = { hover: false };
  renderVals() {
    const p = this.props.p || {};
    const h = this.state.hover;
    return {
      p, zoom: h ? 1.06 : 1, altOpacity: h && p.img2 ? 1 : 0, lift: h ? '-6px' : '0', shadow: h ? 'var(--shadow-lg)' : 'none', plusRot: h ? '90deg' : '0deg',
      heartColor: p.wished ? 'var(--color-accent)' : 'var(--color-text)', heartFill: p.wished ? 'currentColor' : 'none',
      onEnter: () => this.setState({ hover: true }), onLeave: () => this.setState({ hover: false }),
      quickAdd: (e) => { e.stopPropagation(); p.add && p.add(e); },
    };
  }
}
</script>
</body>
</html>
