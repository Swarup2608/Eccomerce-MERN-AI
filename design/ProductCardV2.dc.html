<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="_ds/industry-8d73d954-2ba9-4ed0-a747-9a69caf33582/_ds_bundle.js"></script>
</helmet>
<article style="display:flex;flex-direction:column;gap:14px;min-width:0;height:100%;" onMouseEnter="{{ onEnter }}" onMouseLeave="{{ onLeave }}">
  <div style="position:relative;">
    <div onClick="{{ p.open }}" style="position:relative;aspect-ratio:4/5;cursor:pointer;overflow:hidden;border-radius:var(--box-r,0px);background:var(--color-surface);">
      <span role="img" aria-label="{{ p.name }}" style="display:block;position:absolute;inset:0;width:100%;height:100%;transform:scale({{ zoom }});transition:transform 1.1s cubic-bezier(.2,.7,.2,1);background:var(--color-surface) url({{ p.img }}) center/cover no-repeat;"></span>
      <span role="img" aria-label="" style="display:block;position:absolute;inset:0;width:100%;height:100%;opacity:{{ altOpacity }};transform:scale({{ zoom }});transition:opacity .5s ease,transform 1.1s cubic-bezier(.2,.7,.2,1);background:var(--color-surface) url({{ p.img2 }}) center/cover no-repeat;"></span>
      <div style="position:absolute;top:12px;left:12px;display:flex;gap:6px;flex-wrap:wrap;">
        <sc-if value="{{ p.hasDiscount }}" hint-placeholder-val="{{ false }}"><span class="tag tag-accent" style="font-weight:600;">−{{ p.discount }}%</span></sc-if>
        <sc-if value="{{ p.hasTag }}" hint-placeholder-val="{{ false }}"><span class="tag tag-neutral" style="background:var(--color-bg);">{{ p.tag }}</span></sc-if>
      </div>
      <div style="position:absolute;left:12px;right:12px;bottom:12px;opacity:{{ barOpacity }};transform:translateY({{ barY }});transition:opacity .3s,transform .4s cubic-bezier(.2,.7,.2,1);">
        <button class="btn btn-primary" style="width:100%;justify-content:space-between;min-height:44px;background:var(--color-text);border-color:var(--color-text);color:var(--color-bg);" onClick="{{ quickAdd }}"><span>Quick add</span><span>{{ p.price }}</span></button>
      </div>
    </div>
    <button class="btn btn-icon" aria-label="Save to wishlist" onClick="{{ p.wish }}" style="position:absolute;top:10px;right:10px;width:38px;height:38px;background:var(--color-bg);color:{{ heartColor }};border-radius:999px;border:0;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="{{ heartFill }}" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.210 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg>
    </button>
  </div>
  <div style="display:flex;flex-direction:column;gap:4px;min-width:0;">
    <div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline;">
      <span style="font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text) 60%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ p.vendorName }}</span>
      <span style="display:inline-flex;align-items:center;gap:3px;font-size:12px;white-space:nowrap;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.770l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"></path></svg>{{ p.rating }} <span style="color:color-mix(in srgb,var(--color-text) 55%,transparent);">({{ p.reviews }})</span>
      </span>
    </div>
    <a href="#" onClick="{{ p.open }}" style="font-family:var(--font-heading);font-weight:var(--font-heading-weight);font-size:19px;line-height:1.2;color:var(--color-text);text-decoration:none;" style-hover="color:var(--color-accent);">{{ p.name }}</a>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px;">
      <div style="display:flex;align-items:baseline;gap:8px;">
        <span style="font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;">{{ p.price }}</span>
        <sc-if value="{{ p.hasDiscount }}" hint-placeholder-val="{{ false }}"><span style="font-size:13px;text-decoration:line-through;color:color-mix(in srgb,var(--color-text) 50%,transparent);">{{ p.was }}</span></sc-if>
      </div>
      <div style="display:flex;gap:5px;align-items:center;">
        <sc-for list="{{ p.colors }}" as="c" hint-placeholder-count="2"><span title="{{ c.name }}" style="width:12px;height:12px;border-radius:50%;background:{{ c.sw }};border:1px solid var(--color-divider);"></span></sc-for>
      </div>
    </div>
    <sc-if value="{{ p.low }}" hint-placeholder-val="{{ false }}"><span style="font-size:12px;color:var(--color-accent-700);">Only {{ p.stock }} left</span></sc-if>
  </div>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:480},&quot;p&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}">
class Component extends DCLogic {
  state = { hover: false };
  renderVals() {
    const p = this.props.p || {};
    const h = this.state.hover;
    return {
      p, zoom: h ? 1.05 : 1, altOpacity: h && p.img2 ? 1 : 0, barOpacity: h ? 1 : 0, barY: h ? '0' : '10px',
      heartColor: p.wished ? 'var(--color-accent)' : 'var(--color-text)', heartFill: p.wished ? 'currentColor' : 'none',
      onEnter: () => this.setState({ hover: true }), onLeave: () => this.setState({ hover: false }),
      quickAdd: (e) => { e.stopPropagation(); p.add && p.add(e); },
    };
  }
}
</script>
</body>
</html>
