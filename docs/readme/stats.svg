<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="127 tests passing, 83 API route handlers, 3 apps in one monorepo, 0 known production vulnerabilities">
  <style>
    .card { opacity: 0; animation: pop .7s cubic-bezier(.2, .9, .3, 1.3) forwards; transform-box: fill-box; transform-origin: center; }
    .k2 { animation-delay: .15s; } .k3 { animation-delay: .3s; } .k4 { animation-delay: .45s; }
    @keyframes pop { from { opacity: 0; transform: translateY(16px) scale(.94); } to { opacity: 1; transform: none; } }
    .box { fill: #0f1530; stroke: #2a3263; }
    .num { font: 800 44px "Segoe UI", Helvetica, Arial, sans-serif; }
    .lbl { font: 500 16px "Segoe UI", Helvetica, Arial, sans-serif; fill: #cbd5e1; }
    .glow { animation: glow 3s ease-in-out infinite; }
    @keyframes glow { 50% { stroke-opacity: .25; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .card { opacity: 1; } }
  </style>

  <g class="card k1">
    <rect class="box" x="6" y="10" width="282" height="130" rx="18"/>
    <rect class="glow" x="6" y="10" width="282" height="130" rx="18" fill="none" stroke="#34d399" stroke-width="2"/>
    <text class="num" x="34" y="78" fill="#34d399">127</text>
    <text class="lbl" x="34" y="112">tests passing</text>
  </g>
  <g class="card k2">
    <rect class="box" x="310" y="10" width="282" height="130" rx="18"/>
    <rect class="glow" x="310" y="10" width="282" height="130" rx="18" fill="none" stroke="#22d3ee" stroke-width="2" style="animation-delay:-.75s"/>
    <text class="num" x="338" y="78" fill="#22d3ee">83</text>
    <text class="lbl" x="338" y="112">API route handlers</text>
  </g>
  <g class="card k3">
    <rect class="box" x="614" y="10" width="282" height="130" rx="18"/>
    <rect class="glow" x="614" y="10" width="282" height="130" rx="18" fill="none" stroke="#a78bfa" stroke-width="2" style="animation-delay:-1.5s"/>
    <text class="num" x="642" y="78" fill="#a78bfa">3</text>
    <text class="lbl" x="642" y="112">apps · ~18.5k lines of TypeScript</text>
  </g>
  <g class="card k4">
    <rect class="box" x="918" y="10" width="276" height="130" rx="18"/>
    <rect class="glow" x="918" y="10" width="276" height="130" rx="18" fill="none" stroke="#fbbf24" stroke-width="2" style="animation-delay:-2.25s"/>
    <text class="num" x="946" y="78" fill="#fbbf24">0</text>
    <text class="lbl" x="946" y="112">known prod vulnerabilities</text>
  </g>
</svg>
